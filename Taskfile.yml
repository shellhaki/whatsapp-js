version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies with Bun
    cmds:
      - bun install

  dev:
    desc: Start Next.js development server (Dashboard + API + WhatsApp client)
    cmds:
      - bun run dev

  bot:
    desc: Run standalone headless CLI WhatsApp bot with terminal QR
    cmds:
      - bun run bot

  build:
    desc: Build Next.js application for production
    cmds:
      - bun run build

  start:
    desc: Start production Next.js server
    cmds:
      - bun run start

  typecheck:
    desc: Run TypeScript type checker
    cmds:
      - bun run typecheck

  lint:
    desc: Run ESLint
    cmds:
      - bun run lint

  clean:
    desc: Clean build artifacts and temporary session caches
    cmds:
      - rm -rf .next dist .auth node_modules/.cache
